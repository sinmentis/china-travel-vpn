name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run isolated regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "$workdir"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -qfsSL --connect-timeout 10 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "$workdir/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$workdir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$workdir/gitleaks.tar.gz" -C "$workdir" gitleaks
          "$workdir/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
